name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.24.5'

jobs:
  analyze-and-test:
    name: Analisis y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generar plataformas nativas
        run: flutter create --project-name techmission --org pe.edu.emaf --platforms=android .

      - name: Nombre de la app en Android
        run: sed -i 's/android:label="techmission"/android:label="TechMission"/' android/app/src/main/AndroidManifest.xml

      - name: Dependencias
        run: flutter pub get

      - name: Formato (informativo)
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analisis estatico
        run: flutter analyze --no-fatal-infos

      - name: Pruebas unitarias
        run: flutter test --reporter expanded

  build-apk:
    name: Construir APK
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generar plataformas nativas
        run: flutter create --project-name techmission --org pe.edu.emaf --platforms=android .

      - name: Nombre de la app en Android
        run: sed -i 's/android:label="techmission"/android:label="TechMission"/' android/app/src/main/AndroidManifest.xml

      - name: Dependencias
        run: flutter pub get

      - name: Construir APK de release
        run: flutter build apk --release --build-name=1.0.0 --build-number=${{ github.run_number }}

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: techmission-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
