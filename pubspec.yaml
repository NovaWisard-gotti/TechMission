name: it_management_simulator
description: Simulador educativo de gestion de servicios TI (ITIL 4, Scrum y PMBOK) para estudiantes de Ingenieria de Sistemas.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  shared_preferences: ^2.2.3
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/data/scenarios/
