name: techmission
description: TechMission, simulador educativo de gestion de servicios TI (ITIL 4, Scrum y PMBOK) para estudiantes de Ingenieria de Sistemas.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  shared_preferences: ^2.2.3
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/data/scenarios/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#12507B"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  remove_alpha_ios: true
